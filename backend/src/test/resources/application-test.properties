# Perfil usado pelos testes automatizados: banco H2 em memória (modo MySQL), sem data.sql e sem MySQL.
spring.datasource.url=jdbc:h2:mem:almoxarifado_teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
jwt.secret=segredo-usado-somente-nos-testes-automatizados-com-mais-de-32-bytes
jwt.expiracao-horas=1
